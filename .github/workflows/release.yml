name: Release

# Pushing a v* tag is the single entry point.
#
# This workflow used to *also* trigger on `release: types: [published]`, and that
# fired on top of the tag push.  Not because of anything here: GitHub does not
# start a run for events caused by the default GITHUB_TOKEN, so the Release this
# workflow creates with `gh release create` triggers nothing at all.  It fired
# when a *person* published a release, which is how v0.2.0 and v0.2.1 got theirs
# -- each of those tags has one push run and one release run, while v0.3.0,
# released by the bot, has only the push run.
#
# That path could not do anything useful anyway.  A published release already
# exists, so create_github_release.sh short-circuits on `gh release view` and the
# wheel and sdist are never attached -- the one job this workflow exists to do.
# The trigger was a leftover from when releases were made by hand; now that a tag
# push creates one, publishing by hand is not part of the flow.  To recover from
# a failed run, re-run it from the Actions tab.
#
# Distribution decision (v0.7.0): this repository ships wheels and sdists as
# GitHub Release assets only.  PyPI publication is deferred to the official
# Seafile repository once this code is merged upstream, so there is no PyPI
# publish job here to maintain or misfire.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default; the github-release job widens it for itself only.
permissions:
  contents: read

jobs:
  # Cheapest check first, and its own job so it runs once rather than once per
  # matrix entry: a tag that does not match __version__ should fail in seconds,
  # not after the whole suite has run.  It used to be the *last* step of the
  # test job, so a mistyped tag was discovered only once everything else passed.
  #
  # `import git_remote_seafile` works from the checkout without installing: the
  # package directory is the working directory, which `python -c` puts on
  # sys.path, and `__init__.py` imports nothing outside the standard library.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Verify git tag matches package version
      run: |
        TAG="${{ github.ref_name }}"
        VERSION="v$(python -c 'import git_remote_seafile; print(git_remote_seafile.__version__)')"
        if [ "$TAG" != "$VERSION" ]; then
          echo "ERROR: Tag '$TAG' does not match package __version__ '$VERSION'" >&2
          exit 1
        fi

  # The same matrix CI runs, on purpose.  A release gate exercising one
  # interpreter proves the suite passes on *that* interpreter, which is not the
  # claim a release makes: the tag names a commit, not a platform, and nothing
  # else re-checks the other combinations between the last push to main and
  # the release.
  test:
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing combination must not cancel the rest: the useful output of a
      # red release gate is the list of combinations that fail.
      fail-fast: false
      # Kept in step with ci.yml's nine legs (see the note there); the shape
      # test in tests/test_release_workflow.py fails if the two diverge.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    # Same worker rule as ci.yml: the runner's own CPU count, not a literal.
    # `-j 4` was justified by a four-vCPU assumption that is neither true on
    # every OS in this matrix nor stable across runner-image resizes (D7).
    - name: Run unit tests
      run: python tools/run_tests_parallel.py -j 0

    - name: Run linter
      run: |
        pip install ruff==0.16.10
        ruff check .

  # Build once.  The GitHub Release below attaches exactly this artifact.
  #
  # This job widens its own token, and only its own: attesting what it built
  # needs the OIDC token the attestation is signed against and permission to
  # store the resulting statement.  Every other job in both workflows stays at
  # the workflow default of `contents: read`.
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read      # actions/checkout
      id-token: write     # OIDC token the attestation is signed against
      attestations: write # store the attestation in this repository
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build sdist and wheel
      run: python -m build

    # The artifact is what users install, and until now nothing in this workflow
    # ever opened it: a wheel that cannot be installed, whose metadata renders
    # wrong on the Release page, or that grew a `tools/` directory would have
    # been published unchecked (D3).  The script also asserts the wheel and the
    # sdist disagree about `tools/` on purpose -- SNAPSHOT_GUIDE.md sends
    # users to the sdist for it.  Run it by hand with
    # `bash .github/smoke_install_wheel.sh dist` after a local build.
    - name: Smoke-install the built distributions
      run: bash .github/smoke_install_wheel.sh dist

    # Provenance, which is a different claim from integrity.  A checksum says
    # the file you have is the file that was published; it says nothing about
    # who built it or from which commit.  This attestation is signed by the
    # workflow's own identity and records the commit, so
    # `gh attestation verify dist/<file> --repo <repo>` answers the question a
    # user of a token-handling tool should be asking (D4).
    #
    # It runs *before* the checksum file is written, because the subject glob
    # below would otherwise pick that file up as something to attest.
    - name: Attest the build provenance of the artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    # The same digests, in a file, for anyone verifying by hand or from a script
    # without `gh`.  The two artifact patterns are named rather than globbed so
    # that a re-run in a dirty workspace cannot fold the checksum file into
    # itself.  Written after the attestation, for the reason above.
    - name: Write SHA256SUMS
      run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && cat SHA256SUMS

    # Artifact actions are a matched pair and are bumped together.  These are
    # the lowest majors declaring `runs.using: node24` -- upload@v5 and
    # download@v5/v6 still say node20 -- and both releases are runtime-only
    # ("v5/v6 had preliminary Node 24 support ... now this action by default
    # will run on Node.js 24"), so the artifact API is unchanged and they
    # interoperate exactly as their v4 predecessors did.  Do not bump one
    # without checking the other.
    #
    # The whole directory travels, so SHA256SUMS rides along with the two
    # distributions and reaches the Release without a step of its own --
    # create_github_release.sh attaches every file it finds in dist/.
    - name: Upload the built distributions
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: dist
        path: dist/

  # Pushing a tag used to leave nothing behind but a bare tag: a GitHub Release
  # is a separate object from the tag, so it had to be created by hand every
  # time -- which is how v0.3.0 ended up tagged with no release at all.
  #
  # A separate job so that only this one gets `contents: write`.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Fetch the built distributions
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: dist
        path: dist

    # Uses the workflow's own token, so no personal token is involved.  The
    # script is idempotent and attaches the wheel and sdist, matching the format
    # of the hand-made v0.2.0 and v0.2.1 releases.
    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .github/create_github_release.sh "$GITHUB_REF_NAME"
