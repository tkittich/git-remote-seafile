name: Release

# Pushing a v* tag is the single entry point.  This workflow used to *also*
# trigger on `release: types: [published]`, which made every release run twice:
# the tag-triggered run below creates a Release with `gh release create`, and
# publishing that Release fired the second trigger.  The duplicate was harmless
# only by accident -- the release script checks `gh release view` first, and the
# PyPI step passes `skip-existing`.
#
# It could not be kept as a second entry point either.  On the `release:` path
# the release already exists by definition, so create_github_release.sh always
# short-circuited and the wheel and sdist were never attached -- the one job
# this workflow exists to do.  To recover from a failed run, re-run it from the
# Actions tab.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default; the publish job below needs to mint an OIDC token
# to authenticate to PyPI (trusted publishing), and the release job needs to
# write a Release.  Both widen it for themselves only.
permissions:
  contents: read

jobs:
  # Build once.  Both consumers below take the same artifact, so the wheel that
  # gets attached to the Release is byte-for-byte the one offered to PyPI.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build sdist and wheel
      run: python -m build

    - name: Upload the built distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-to-pypi:
    needs: build
    runs-on: ubuntu-latest
    # Required for PyPI trusted publishing (OIDC). Without it the publish step
    # fails with "OpenID Connect token retrieval failed ... ACTIONS_ID_TOKEN_
    # REQUEST_TOKEN was unset" whenever no PYPI_API_TOKEN secret is present.
    permissions:
      id-token: write
    env:
      # Surfaced at job level because `secrets` is not an available context in a
      # step-level `if` (GitHub's contexts reference lists only github, needs,
      # strategy, matrix, job, runner, env, vars, steps and inputs there),
      # whereas `env` is.  Masked in logs like any secret.
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
    - name: Fetch the built distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    # Two ways to authenticate: the PYPI_API_TOKEN secret, or trusted
    # publishing via OIDC (which needs `id-token: write` above AND a Trusted
    # Publisher configured for this repo on PyPI).
    #
    # When neither is configured the step is skipped rather than failed.  A
    # publish that cannot possibly succeed should not paint the release red and
    # mask real failures -- the same reason CI no longer uses fail-fast.
    - name: Publish to PyPI
      if: env.PYPI_API_TOKEN != '' || vars.PUBLISH_TO_PYPI == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    - name: Explain the skipped PyPI publish
      if: env.PYPI_API_TOKEN == '' && vars.PUBLISH_TO_PYPI != 'true'
      run: |
        echo "::notice::Skipped the PyPI publish - no credentials are configured."
        echo "The sdist and wheel were still built and are attached to the GitHub"
        echo "Release. To also publish to PyPI, either:"
        echo "  * set the PYPI_API_TOKEN repository secret, or"
        echo "  * configure a Trusted Publisher for this repo on PyPI and set the"
        echo "    PUBLISH_TO_PYPI repository variable to 'true'."

  # Pushing a tag used to leave nothing behind but a bare tag: a GitHub Release
  # is a separate object from the tag, so it had to be created by hand every
  # time -- which is how v0.3.0 ended up tagged with no release at all.
  #
  # Separate job so that only this one gets `contents: write`; the publish job
  # runs a third-party action and keeps the narrower permission set.  It depends
  # on `build` and not on `publish-to-pypi`, so a PyPI problem cannot block the
  # release.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Fetch the built distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    # Uses the workflow's own token, so no personal token is involved.  The
    # script is idempotent and attaches the wheel and sdist, matching the format
    # of the hand-made v0.2.0 and v0.2.1 releases.
    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .github/create_github_release.sh "$GITHUB_REF_NAME"
