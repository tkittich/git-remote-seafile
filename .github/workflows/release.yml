name: Release

# Pushing a v* tag is the single entry point.
#
# This workflow used to *also* trigger on `release: types: [published]`, and that
# fired on top of the tag push.  Not because of anything here: GitHub does not
# start a run for events caused by the default GITHUB_TOKEN, so the Release this
# workflow creates with `gh release create` triggers nothing at all.  It fired
# when a *person* published a release, which is how v0.2.0 and v0.2.1 got theirs
# -- each of those tags has one push run and one release run, while v0.3.0,
# released by the bot, has only the push run.
#
# That path could not do anything useful anyway.  A published release already
# exists, so create_github_release.sh short-circuits on `gh release view` and the
# wheel and sdist are never attached -- the one job this workflow exists to do.
# The trigger was a leftover from when releases were made by hand; now that a tag
# push creates one, publishing by hand is not part of the flow.  To recover from
# a failed run, re-run it from the Actions tab.
#
# Distribution decision (v0.7.0): this repository ships wheels and sdists as
# GitHub Release assets only.  PyPI publication is deferred to the official
# Seafile repository once this code is merged upstream, so there is no PyPI
# publish job here to maintain or misfire.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default; the github-release job widens it for itself only.
permissions:
  contents: read

jobs:
  # Gate release packaging and distribution on passing the unit test suite.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run unit tests
      run: python tools/run_tests_parallel.py -j 4

    - name: Run linter
      run: |
        pip install ruff==0.16.10
        ruff check .

    - name: Verify git tag matches package version
      run: |
        TAG="${{ github.ref_name }}"
        VERSION="v$(python -c 'import git_remote_seafile; print(git_remote_seafile.__version__)')"
        if [ "$TAG" != "$VERSION" ]; then
          echo "ERROR: Tag '$TAG' does not match package __version__ '$VERSION'" >&2
          exit 1
        fi

  # Build once.  The GitHub Release below attaches exactly this artifact.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build sdist and wheel
      run: python -m build

    # Artifact actions are a matched pair and are bumped together.  These are
    # the lowest majors declaring `runs.using: node24` -- upload@v5 and
    # download@v5/v6 still say node20 -- and both releases are runtime-only
    # ("v5/v6 had preliminary Node 24 support ... now this action by default
    # will run on Node.js 24"), so the artifact API is unchanged and they
    # interoperate exactly as their v4 predecessors did.  Do not bump one
    # without checking the other.
    - name: Upload the built distributions
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: dist
        path: dist/

  # Pushing a tag used to leave nothing behind but a bare tag: a GitHub Release
  # is a separate object from the tag, so it had to be created by hand every
  # time -- which is how v0.3.0 ended up tagged with no release at all.
  #
  # A separate job so that only this one gets `contents: write`.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Fetch the built distributions
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: dist
        path: dist

    # Uses the workflow's own token, so no personal token is involved.  The
    # script is idempotent and attaches the wheel and sdist, matching the format
    # of the hand-made v0.2.0 and v0.2.1 releases.
    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .github/create_github_release.sh "$GITHUB_REF_NAME"
