name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

# Least privilege by default; the publish step below needs to mint an OIDC
# token to authenticate to PyPI (trusted publishing).
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Required for PyPI trusted publishing (OIDC). Without it the publish step
    # fails with "OpenID Connect token retrieval failed ... ACTIONS_ID_TOKEN_
    # REQUEST_TOKEN was unset" whenever no PYPI_API_TOKEN secret is present.
    permissions:
      id-token: write
    env:
      # Surfaced at job level because `secrets` is not an available context in a
      # step-level `if` (GitHub's contexts reference lists only github, needs,
      # strategy, matrix, job, runner, env, vars, steps and inputs there),
      # whereas `env` is.  Masked in logs like any secret.
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build sdist and wheel
      run: python -m build

    # Two ways to authenticate: the PYPI_API_TOKEN secret, or trusted
    # publishing via OIDC (which needs `id-token: write` above AND a Trusted
    # Publisher configured for this repo on PyPI).
    #
    # When neither is configured the step is skipped rather than failed.  A
    # publish that cannot possibly succeed should not paint the release red and
    # mask real failures -- the same reason CI no longer uses fail-fast.
    - name: Publish to PyPI
      if: env.PYPI_API_TOKEN != '' || vars.PUBLISH_TO_PYPI == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    - name: Explain the skipped PyPI publish
      if: env.PYPI_API_TOKEN == '' && vars.PUBLISH_TO_PYPI != 'true'
      run: |
        echo "::notice::Skipped the PyPI publish - no credentials are configured."
        echo "The sdist and wheel were still built. To publish, either:"
        echo "  * set the PYPI_API_TOKEN repository secret, or"
        echo "  * configure a Trusted Publisher for this repo on PyPI and set the"
        echo "    PUBLISH_TO_PYPI repository variable to 'true'."
        echo "Then re-run this workflow, or move the tag to a commit that includes"
        echo "the current workflow file."
