name: real-server (Seafile container)

# The T1/T2 gap closer: every real-server bug so far was found by hand, because
# the stub encodes the authors' beliefs about the server rather than the
# server's behavior.  This workflow stands up a throwaway Seafile CE container
# (`.github/seafile-ci.yml`), runs `tests.test_realserver` against it, and
# deletes the scratch library it created -- nothing outside the runner survives.
#
# Weekly, and by hand before a release (tools/release_check.py requires it green
# on both legs at the commit being tagged).  It was dispatch-only until CE and Pro
# had been green (first CE run 2026-10-28; both editions, 2026-11-07, ROADMAP B8):
# first runs here fail environmentally, and the images are pinned by digest in
# .github/seafile-ci.yml so a weekly run tests the same server every week.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"   # weekly, Sunday 03:17 UTC

# Least privilege, same as ci.yml: nothing here writes to the repository.
permissions:
  contents: read

# A second manual trigger while one run is in flight queues behind it rather
# than racing it for the mapped port.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  realserver:
    # Forks burn their own minutes on a container this size for a suite whose
    # findings only matter on the repository that can act on them.
    if: github.repository == 'tkittich/git-remote-seafile'
    runs-on: ubuntu-latest
    # Image pull + first boot + the suite itself; generous, but bounded.
    timeout-minutes: 60
    # Community and Professional answer some requests differently (issue 6: a file read under a
    # missing folder is 404 on CE, 403 or a 500 page on Pro), so the suite runs against both.
    # Each leg is its own runner, so the two containers never share the mapped port.
    strategy:
      fail-fast: false
      matrix:
        edition: [ce, pro]
    name: realserver (${{ matrix.edition }})
    env:
      # Pinned by digest, as in .github/seafile-ci.yml (ROADMAP B8).
      SEAFILE_IMAGE: ${{ matrix.edition == 'pro' && 'seafileltd/seafile-pro-mc:13.0-latest@sha256:1b11a6b7aa4e81944d844d7bd99fe82f38ba3624a11bb25285155adafb5220f9' || 'seafileltd/seafile-mc:13.0-latest@sha256:9506f49d5e5065082c134e6348498eed5a5866ddbd94bd5a3e479a6c285bc61a' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # First dispatch (2026-10-28) pulled and booted the images, then died at
      # `import requests`: the runner's Python has no packages, and the suite
      # imports the package under test as well as the driver's own `requests`.
      - name: Install the package under test
        run: python -m pip install .
      - name: Start the Seafile ${{ matrix.edition }} container
        run: docker compose -f .github/seafile-ci.yml up -d
      # ROADMAP B8: the tags float, so each run records what it actually tested
      # (the digest of every image) -- the record the pins are taken from.
      - name: Record the image digests
        run: |
          for image in $(docker compose -f .github/seafile-ci.yml config --images); do
            echo "IMAGE $image $(docker image inspect --format '{{join .RepoDigests " "}}' "$image")"
          done
      - name: Run the real-server suite against it
        run: python tools/realserver_ci.py
      # S15: the probe that finds the largest accepted upload, against a proxy
      # limit this project can finally set.  First dispatch (2026-10-28): the
      # image's nginx keeps its directives in /etc/nginx/sites-enabled/
      # seafile.nginx.conf (10m at the top, 0 on the transfer locations), and the
      # probe found the 48 MiB it was set to (45 accepted, 48 refused).
      - name: Lower the proxy's body limit and let doctor find it
        run: |
          docker compose -f .github/seafile-ci.yml exec -T seafile sh -c '
            files=$(grep -rl client_max_body_size /shared/nginx /etc/nginx 2>/dev/null)
            echo "files naming client_max_body_size: $files"
            grep -n client_max_body_size $files
            sed -i "s/client_max_body_size [^;]*;/client_max_body_size 48m;/" $files
            grep -n client_max_body_size $files
            nginx -t && nginx -s reload'
          python tools/realserver_ci.py --upload-limit-check 48
      # 0.9.19's pack split, against the real nginx instead of the stub's imitation of
      # it: a git push of twice the limit must be refused, rebuilt in smaller packs,
      # and arrive whole (the limit is still the 48 MiB set just above).
      - name: Push through the lowered limit
        run: python tools/realserver_ci.py --body-limit-tests 48
      # The container is both the subject and the best diagnostic: when the
      # suite or the readiness probe fails, the reason is in these logs, and
      # the runner (with the container) disappears at the end of the job.
      # Fourth dispatch: the container booted, but "Error happened during
      # creating seafile admin" printed no reason and /api2/auth-token/ answered
      # 500.  The reason is in seahub's own logs and in the image's init script,
      # neither of which `compose logs` shows.
      - name: Seahub logs and the image's admin script
        if: failure()
        run: |
          docker compose -f .github/seafile-ci.yml exec -T seafile sh -c \
            'ls /shared/seafile/logs; tail -n 60 /shared/seafile/logs/seahub.log /shared/seafile/logs/seafile.log /opt/seafile/logs/*.log 2>&1; echo ---- check_init_admin; cat /scripts/check_init_admin.py 2>&1' || true
      - name: Container logs and teardown
        if: always()
        run: |
          docker compose -f .github/seafile-ci.yml logs --tail 300 seafile db
          docker compose -f .github/seafile-ci.yml down -v
