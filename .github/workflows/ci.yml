name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege.  Nothing in this workflow writes to the repository, and the
# default token is read/write on older repository settings, so the scope is
# stated rather than inherited.  `release.yml` has carried the same block since
# it was written; this file was the one without it (D1).
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it.  The matrix is the
# expensive part of this workflow -- fifteen jobs, each running the whole suite
# -- and without this a series of pushes to one branch queues fifteen more jobs
# per push behind the ones already running (D6).  The cancelled run's logs stay
# available; what is lost is a verdict on a commit that has already been
# replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing job must not cancel the other 14.  With fail-fast on, the
      # first failure hides every other platform/version -- which is how a
      # 3.8-only dependency failure masked a 3.10-only test failure for
      # several commits.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    # Action majors below are the *lowest* whose action.yml declares
    # `runs.using: node24`.  They were on checkout@v4 / setup-python@v5, which
    # still declare node20 and drew a deprecation annotation on every job:
    # GitHub was already forcing them onto Node 24, so this makes the
    # declaration match what was actually running.  Both bumps are runtime-only
    # -- checkout@v5 is "update to node 24" and nothing else, setup-python@v6's
    # sole breaking change is the same -- which is why they are preferred over
    # the newer majors that also change credential handling (checkout@v6) or
    # the module system (both @v7).
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        # Full history, including tags.  The release-notes guard checks that a
        # notes file's Full Changelog link compares against a tag that really
        # exists, and the default shallow clone fetches no tags at all -- which
        # made that guard fail on every runner.  The repository is small, so
        # this costs almost nothing.
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        # Fifteen legs each resolve `requests` and its dependencies from the
        # index.  The cache key is pyproject.toml, named explicitly rather than
        # left to the action's file search, so the cache is invalidated exactly
        # when the declared dependencies change (D6).
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    # Same suite, same discovery, run across processes instead of one.
    # `python -m unittest discover tests` is the fallback if this ever misbehaves
    # on a platform -- it is what the runner reproduces.
    #
    # The parallel runner is what makes the 15-way matrix affordable: this job
    # runs 15 times over (3 OS x 5 versions) and the whole pipeline takes as long
    # as its slowest job, so the per-job saving is the pipeline saving.  Timings
    # for the current suite live in CONTRIBUTING.md.  The curve that used to be
    # quoted here was measured at 268 tests and had drifted for several releases
    # (B4), so it was deleted rather than re-measured in a third place.
    #
    # The worker count is the runner's own default -- one per CPU it can see --
    # rather than a literal.  It used to be `-j 4`, justified by "the runner has
    # four vCPUs": a number that is not the same on every OS in this matrix and
    # changes whenever GitHub resizes a runner image (D7).  The default follows
    # the machine, and the runner clamps the count to the number of targets, so
    # a large self-hosted box cannot start more workers than there is work.
    #
    # The runner emits the same unittest prose, so the reporting step below
    # still finds its FAIL:/ERROR: blocks -- checked against both a passing and
    # a deliberately failing run before switching.
    - name: Run unit tests
      run: |
        python tools/run_tests_parallel.py -j 0 > unittest-output.txt 2>&1

    # Runs even when the step above fails.  Workflow logs need admin rights to
    # download; annotations do not, so the failing test names stay visible.
    - name: Report test results
      if: always()
      run: python .github/ci_report_failures.py unittest-output.txt

  # One job rather than fifteen: the linter does not care which platform or
  # which interpreter, and it runs *alongside* the matrix rather than after it,
  # so it adds no wall clock to the pipeline.
  #
  # The ruff version is pinned on purpose.  An unpinned linter turns a green
  # branch red overnight when a new rule ships, and the failure says nothing
  # about what actually changed.  Bumping the pin is a reviewable one-line diff.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install ruff
      run: python -m pip install ruff==0.16.10

    # Rules and target-version live in pyproject.toml under [tool.ruff], so this
    # job and a local `ruff check .` cannot disagree about what is checked.
    #
    # `--output-format github` emits findings as annotations, for the same
    # reason ci_report_failures.py exists: workflow logs need admin rights to
    # download, annotations do not.
    - name: Lint
      run: ruff check --output-format github .

    # The doc guards used to run only inside the test suite, and the drift
    # scenarios that prove they *work* were wired into nothing at all -- so the
    # guards could have rotted into vacuous passes with every job still green
    # (B4).  Both are cheap: the guards are a handful of regex checks over ten
    # documents, and the scenarios are the same checks against deliberately
    # drifted text.  The package is not installed -- the guards import
    # `git_remote_seafile` from the checkout, which `python` puts on sys.path --
    # but its `cli` module imports `requests`, so that one dependency is (a bare
    # interpreter fails with ModuleNotFoundError, which is how v0.8.8's first
    # tag run found out).
    - name: Doc guards and their drift scenarios
      run: |
        python -m pip install requests
        python -m unittest tests.test_docs_consistency
        python tools/verify_docs_guards.py

  # One job rather than fifteen, for the same reason as `lint`: a type checker
  # does not care which platform it runs on, and it runs alongside the matrix
  # rather than after it, so it adds no wall clock to the pipeline.
  #
  # The scope and the strictness live in pyproject.toml under [tool.mypy], so
  # this job and a local `mypy` cannot disagree about what is checked.  What was
  # missing was the *enforcement*: the annotations were there and nothing ran
  # them, which is how the package accumulated errors a job would have caught on
  # arrival (D6).
  #
  # There is no annotation step here, unlike `lint` and the test jobs.  ruff has
  # `--output-format github` and unittest output is parsed by
  # ci_report_failures.py; mypy 2.4.0 offers only `json`.  Its findings are
  # already `path:line:col`, which is what the log shows -- so this job is a
  # gate first and a report second.
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    # Pinned, like ruff: an unpinned type checker turns a green branch red
    # overnight when a release changes its inference, and the failure says
    # nothing about what actually changed.
    #
    # `types-requests` is not optional.  With no stub for `requests`, the
    # checker reports the *missing stub* as errors inside this code, which is
    # noise rather than a finding.  `-e .` brings the dependency the stub
    # describes, so this run and a local one resolve the same imports.
    - name: Install mypy and the requests stub
      run: |
        python -m pip install --upgrade pip
        pip install mypy==2.4.0 types-requests -e .

    # Bare `mypy`: the files to check come from [tool.mypy], so there is no
    # second place to keep in step with it.
    - name: Type check
      run: mypy

  # The dependency floor in pyproject.toml is a *security* floor -- it names the
  # releases that fixed three CVEs in requests' own credential handling -- and
  # every job above installs the *latest* requests instead.  A floor that has
  # never been installed is a number in a metadata file rather than a tested
  # claim (D5).
  #
  # One leg, Ubuntu only: the question is which library version works, not
  # which platform, and the matrix above already covers the platforms.  The
  # interpreter is the lowest supported one, where a version-resolution
  # surprise is likeliest.
  min-deps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Install the declared floor
      run: |
        python -m pip install --upgrade pip
        # The exact version the floor names.  Bumping the floor in
        # pyproject.toml means bumping it here too, or this job quietly stops
        # testing what the package declares.
        pip install "requests==2.32.4"
        # --no-deps: without it the editable install is free to resolve a newer
        # requests over the pin, and the job would pass having never run
        # against the floor it exists to exercise.
        pip install --no-deps -e .

    # Fails rather than warns.  If resolution moved off the pin, every result
    # below describes a version the floor does not name.
    - name: Assert the pin survived the install
      run: python -c "import sys, requests; print('requests', requests.__version__); sys.exit(0 if requests.__version__ == '2.32.4' else 1)"

    - name: Run unit tests
      run: python tools/run_tests_parallel.py -j 0 > unittest-output.txt 2>&1

    - name: Report test results
      if: always()
      run: python .github/ci_report_failures.py unittest-output.txt

  # One leg, for the same reason as `min-deps`: the question is what the suite
  # *executes*, not which platform it runs on, and the matrix already covers the
  # platforms.  3.11 rather than the floor, because this is a measurement rather
  # than a compatibility claim.
  #
  # The configuration lives in pyproject.toml under [tool.coverage.*].  Two
  # settings there are load-bearing.  The suite runs in worker processes
  # (tools/run_tests_parallel.py) and the end-to-end tests exercise the helper
  # as a subprocess of `git`, so measuring the driver alone would produce a
  # number that looks like coverage and is not: `parallel` keeps each process's
  # data in its own file instead of letting the last one overwrite it, and
  # `patch` installs a startup hook and puts the setting in the environment, so
  # the workers are measured -- and so is the helper, because the hook lives in
  # site-packages and the variable is inherited through `git`.
  #
  # There is deliberately no threshold.  A `fail_under` chosen to make today's
  # build green is one that gets raised for the wrong reason or lowered for a
  # worse one; what this job is for is that a *drop* is visible, and a published
  # table does that.
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinned for the same reason as ruff and mypy.  `patch` needs 7.4+.
        pip install coverage==7.16.2 -e .

    # The suite's own exit status is not this job's verdict -- the step below
    # fails the job if unittest did not print OK, exactly as in the matrix jobs.
    # Swallowing it here is what lets a report still be produced for a run that
    # failed, which is when a coverage number is most worth having.
    - name: Run the suite under coverage
      run: |
        coverage run tools/run_tests_parallel.py -j 0 > unittest-output.txt 2>&1 || echo "the suite did not pass; the report below still describes what ran"
        coverage combine
        coverage report --show-missing | tee coverage-report.txt

    - name: Report test results
      if: always()
      run: python .github/ci_report_failures.py unittest-output.txt

    # The report is the deliverable, and a workflow log needs admin rights to
    # download while the job summary does not -- the same reasoning that made
    # ci_report_failures.py emit annotations instead of printing to the log.
    - name: Publish the coverage report
      if: always()
      run: |
        {
          echo '### Coverage'
          echo
          echo '```'
          cat coverage-report.txt 2>/dev/null || echo '(no report: the run did not reach coverage report)'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
