# A Seafile CE 13.0 container for the real-server suite (`.github/workflows/realserver.yml`).
#
# The shape of the official 13.0 compose (https://manual.seafile.com/13.0/repo/docker/ce/seafile-server.yml
# and its `.env`): MariaDB, Redis and the seafile image, whose nginx answers on
# :80.  13.0 is what the measurements in DESIGN.md section 4.3 were taken on
# (CE 13.0.28), so it is the version this suite has to run against.  The first
# four dispatches used a 12.0 shape with 12.0's variable names
# (DB_HOST/DB_PASSWORD/DB_ROOT_PASSWD, memcached); the manual's pages differ
# between versions, and 13.0 passes SEAFILE_MYSQL_DB_* and
# INIT_SEAFILE_MYSQL_ROOT_PASSWORD straight through.
#
# Left out on purpose: caddy (the runner talks to the container directly),
# SeaDoc, the notification server and Seafile AI (nothing here touches them).
# The seafile container publishes :80 itself because there is no proxy in
# front, and the hostname is a bare IP: setup rejects `localhost:8080`
# ("not a valid ip or domain"), and first boot writes SERVICE_URL and
# FILE_SERVER_ROOT from the hostname alone, so the server's transfer links must
# be reachable from the runner at http://127.0.0.1.
#
# The credentials are throwaway by construction: they exist only on the CI
# runner's container, for a library that is deleted at the end of every run.
name: grs-realserver

services:
  db:
    image: mariadb:10.11
    # Root password only, as in the official compose: the seafile image creates
    # its own databases and user on first boot.
    environment:
      MYSQL_ROOT_PASSWORD: grs-ci-root
      MYSQL_LOG_CONSOLE: "true"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 36

  redis:
    image: redis
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    environment:
      REDIS_PASSWORD: ""

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    ports:
      - "80:80"
    volumes:
      - seafile-data:/shared
    environment:
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: grs-ci-db
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: grs-ci-root
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: Etc/UTC
      INIT_SEAFILE_ADMIN_EMAIL: ci@grs.invalid
      INIT_SEAFILE_ADMIN_PASSWORD: grs-ci-admin
      SEAFILE_SERVER_HOSTNAME: 127.0.0.1
      SEAFILE_SERVER_PROTOCOL: http
      JWT_PRIVATE_KEY: grs-ci-not-a-secret-but-long-enough-0123456789
      CACHE_PROVIDER: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      ENABLE_SEADOC: "false"
      ENABLE_NOTIFICATION_SERVER: "false"
      ENABLE_SEAFILE_AI: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  seafile-data:
