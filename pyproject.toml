[build-system]
# 77 is where setuptools learned to read `license = "Apache-2.0"` as a PEP 639
# SPDX expression.  The floor used to say 61, which is the version that wanted
# the older `license = {text = "..."}` table: building with 76.1.0 fails
# outright with "invalid pyproject.toml config: `project.license`".
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-remote-seafile"
# Declared once, in the package.  This used to be a second copy of the same
# fact -- `version = "0.3.0"` here and `__version__` in __init__.py -- kept in
# step by a test.  The build reads the package attribute instead; see
# [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Transparent Git remote helper for Seafile servers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["seafile", "git", "remote-helper", "version-control", "cloud-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    # A *security* floor, not a feature one.  The helper holds a Seafile token
    # and runs inside every `git` invocation, so the transport library's own
    # credential handling is part of this tool's attack surface:
    #
    #   2.31.0  CVE-2023-32681 -- the Proxy-Authorization header followed a
    #           redirect to a different host.
    #   2.32.0  CVE-2024-35195 -- `verify=False` set on a Session persisted
    #           into later requests made through that same Session.
    #   2.32.4  CVE-2024-47081 -- a crafted URL could leak .netrc credentials
    #           to a third party.
    #
    # The previous floor (2.25.0) predated all three and was chosen for a
    # feature this code does not use (D5).  The `min-deps` job in ci.yml pins
    # exactly this version and runs the suite against it, so the floor is a
    # tested claim rather than a number in a metadata file.
    "requests>=2.32.4"
]

[project.urls]
Homepage = "https://github.com/tkittich/git-remote-seafile"
Documentation = "https://github.com/tkittich/git-remote-seafile/blob/main/USER_GUIDE.md"
Issues = "https://github.com/tkittich/git-remote-seafile/issues"

[project.scripts]
git-remote-seafile = "git_remote_seafile.cli:main"

[tool.setuptools.packages.find]
include = ["git_remote_seafile*"]

[tool.setuptools.dynamic]
# setuptools resolves this by parsing __init__.py, not by importing the package,
# as long as __version__ stays a plain string literal.  test_version_consistency
# keeps both halves of that true.
version = {attr = "git_remote_seafile.__version__"}

[tool.ruff]
# Read by the `lint` job in .github/workflows/ci.yml.
#
# Correctness rules only.  Pyflakes (F) catches unused imports and undefined
# names, E9 catches syntax errors, and bugbear (B) catches the traps that
# survive review -- a loop variable that is never read, an exception re-raised
# without its cause.  The wider E/W style sets are deliberately left off: the
# codebase already has a consistent house style, and a linter that argues about
# line length is one people learn to filter out.
#
# This is the floor, not the interpreter: ruff uses it to decide which syntax
# is legal, so it has to track requires-python.
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]

