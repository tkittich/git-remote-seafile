[build-system]
# 77 is where setuptools learned to read `license = "Apache-2.0"` as a PEP 639
# SPDX expression.  The floor used to say 61, which is the version that wanted
# the older `license = {text = "..."}` table: building with 76.1.0 fails
# outright with "invalid pyproject.toml config: `project.license`".
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-remote-seafile"
# Declared once, in the package.  This used to be a second copy of the same
# fact -- `version = "0.3.0"` here and `__version__` in __init__.py -- kept in
# step by a test.  The build reads the package attribute instead; see
# [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Transparent Git remote helper for Seafile servers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["seafile", "git", "remote-helper", "version-control", "cloud-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    # A *security* floor, not a feature one.  The helper holds a Seafile token
    # and runs inside every `git` invocation, so the transport library's own
    # credential handling is part of this tool's attack surface:
    #
    #   2.31.0  CVE-2023-32681 -- the Proxy-Authorization header followed a
    #           redirect to a different host.
    #   2.32.0  CVE-2024-35195 -- `verify=False` set on a Session persisted
    #           into later requests made through that same Session.
    #   2.32.4  CVE-2024-47081 -- a crafted URL could leak .netrc credentials
    #           to a third party.
    #
    # The previous floor (2.25.0) predated all three and was chosen for a
    # feature this code does not use (D5).  The `min-deps` job in ci.yml pins
    # exactly this version and runs the suite against it, so the floor is a
    # tested claim rather than a number in a metadata file.
    "requests>=2.32.4"
]

[project.urls]
Homepage = "https://github.com/tkittich/git-remote-seafile"
Documentation = "https://github.com/tkittich/git-remote-seafile/blob/main/USER_GUIDE.md"
Issues = "https://github.com/tkittich/git-remote-seafile/issues"

[project.scripts]
git-remote-seafile = "git_remote_seafile.cli:main"
# `git seafile-snapshot ...` works anywhere git finds this on PATH.
git-seafile-snapshot = "git_remote_seafile.snapshot_tool:main"

[tool.setuptools.packages.find]
include = ["git_remote_seafile*"]

# PEP 561: the marker is what tells a downstream type checker the package
# is annotated.  Without package-data it silently leaves the wheel out.
[tool.setuptools.package-data]
git_remote_seafile = ["py.typed"]

[tool.setuptools.dynamic]
# setuptools resolves this by parsing __init__.py, not by importing the package,
# as long as __version__ stays a plain string literal.  test_version_consistency
# keeps both halves of that true.
version = {attr = "git_remote_seafile.__version__"}

[tool.ruff]
# tools/_snapshot/*.py are *fragments* of git_remote_seafile/snapshot_tool.py (see
# tools/build_snapshot.py): each one uses names defined in another, so linted
# alone they are a wall of F821.  The generated file is linted instead -- it is
# the same text, and it is what ships.
extend-exclude = ["tools/_snapshot"]
# Read by the `lint` job in .github/workflows/ci.yml.
#
# Correctness rules only.  Pyflakes (F) catches unused imports and undefined
# names, E9 catches syntax errors, and bugbear (B) catches the traps that
# survive review -- a loop variable that is never read, an exception re-raised
# without its cause.  The wider E/W style sets are deliberately left off: the
# codebase already has a consistent house style, and a linter that argues about
# line length is one people learn to filter out.
#
# This is the floor, not the interpreter: ruff uses it to decide which syntax
# is legal, so it has to track requires-python.
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.mypy]
# Read by the `typecheck` job in .github/workflows/ci.yml.
#
# Scope is the code that ships: the package and tools/.  `tests/` is
# deliberately out of scope.  It is a namespace package (no `__init__.py`), so
# mypy resolves each module under two names and stops before checking anything,
# and its test doubles are `MagicMock`s whose attributes no annotation can
# describe.  A check that has to exclude a third of what it sees is not one
# people trust.
files = ["git_remote_seafile", "tools"]
# The snapshot tool's parts are fragments of one module; the generated file is
# what is checked (see [tool.ruff]).
exclude = ["tools/_snapshot/"]
# The floor, not the interpreter -- the same reasoning as [tool.ruff] above:
# this decides which syntax and which stdlib signatures are legal, so it has to
# track requires-python.
python_version = "3.10"
# With the annotations enforced, a `# type: ignore` that is no longer needed is
# itself a defect: it would silently absorb the next real error on that line.
warn_unused_ignores = true

[tool.coverage.run]
# Read by the `coverage` job in .github/workflows/ci.yml.
#
# `source` is the package, so the report is about shipped code rather than
# about tools/ or the tests.
source = ["git_remote_seafile"]
# The suite runs in worker processes (tools/run_tests_parallel.py) and the
# end-to-end tests exercise the helper as a subprocess of `git`.  `parallel`
# keeps each process's data in its own file rather than letting the last one
# overwrite it; `patch` installs a startup hook and puts the setting in the
# environment, so the workers are measured -- and so is the helper, because
# the hook lives in site-packages and the variable is inherited through
# `git`.  Without both, the report would describe the parent process alone: a
# number that looks like coverage and is not.
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
# Per-line detail is the point of publishing a report: a percentage nobody can
# act on is decoration.
show_missing = true
# Deliberately no `fail_under`.  A threshold chosen to make today's build green
# is one that gets raised for the wrong reason or lowered for a worse one; what
# matters first is that a *drop* is visible in review, and publishing the table
# gives exactly that.
